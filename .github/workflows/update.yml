name: Mise à jour pharmacies de garde

on:
  schedule:
    - cron: "0 10 * * 1"   # lundi 12h Paris (heure d'été, UTC+2)
    - cron: "0 11 * * 1"   # lundi 12h Paris (heure d'hiver, UTC+1)
  workflow_dispatch:        # permet de lancer manuellement depuis l'onglet "Actions"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Lancer le script d'extraction
        run: python scrape_pharmacies.py

      - name: Publier les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Mise à jour automatique des pharmacies de garde"
          git push
